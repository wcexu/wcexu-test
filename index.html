<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Username Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --primary: #0f3460;
            --accent: #e94560;
            --success: #00d2ff;
            --text: #ffffff;
            --text-secondary: #a0aec0;
            --border-radius: 16px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 80px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .header-title {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--success), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-balance {
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
        }
        .header-balance span {
            color: var(--success);
            font-size: 16px;
        }
        .sync-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #0f3460, #1a4a7a);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .sync-btn:active {
            transform: scale(0.97);
        }
        .sync-btn.loading {
            opacity: 0.7;
            pointer-events: none;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 6px;
            border-radius: var(--border-radius);
            overflow-x: auto;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            min-width: fit-content;
        }
        .tab-btn.active {
            background: var(--primary);
            color: var(--text);
            box-shadow: 0 4px 12px rgba(15, 52, 96, 0.4);
        }
        .tab-btn:active {
            transform: scale(0.95);
        }
        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .card:active {
            transform: scale(0.98);
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .card-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .card-price {
            font-size: 20px;
            font-weight: 700;
            color: var(--success);
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .card-username {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .card-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-auction {
            background: rgba(233, 69, 96, 0.2);
            color: var(--accent);
        }
        .badge-fixed {
            background: rgba(0, 210, 255, 0.2);
            color: var(--success);
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-align: center;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #1a4a7a);
            color: white;
        }
        .btn-success {
            background: linear-gradient(135deg, var(--success), #00b4d8);
            color: white;
        }
        .btn-danger {
            background: linear-gradient(135deg, var(--accent), #c0392b);
            color: white;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text);
        }
        .btn-sm {
            padding: 8px 16px;
            font-size: 12px;
            width: auto;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 24px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .modal-close {
            float: right;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
        }
        .modal-body {
            margin-bottom: 16px;
        }
        .modal-footer {
            display: flex;
            gap: 8px;
        }
        .modal-footer .btn {
            flex: 1;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .form-input:focus {
            border-color: var(--success);
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .profile-stat {
            text-align: center;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
        }
        .profile-stat-number {
            font-size: 24px;
            font-weight: 700;
            color: var(--success);
        }
        .profile-stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .empty-state-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }
        .toast-container {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            width: 90%;
            max-width: 400px;
        }
        .toast {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            margin-bottom: 8px;
            border-left: 4px solid var(--success);
            box-shadow: var(--shadow);
            animation: toastIn 0.3s ease;
        }
        .toast.error {
            border-left-color: var(--accent);
        }
        @keyframes toastIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .list-item:last-child {
            border-bottom: none;
        }
        .list-item-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .list-item-content {
            flex: 1;
        }
        .list-item-title {
            font-weight: 600;
            font-size: 14px;
        }
        .list-item-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .list-item-right {
            text-align: right;
            flex-shrink: 0;
        }
        .list-item-price {
            font-weight: 700;
            color: var(--success);
            font-size: 14px;
        }
        @media (max-width: 480px) {
            body { padding: 12px; padding-bottom: 70px; }
            .header-title { font-size: 18px; }
            .header-balance { font-size: 12px; padding: 6px 12px; }
            .tab-btn { font-size: 12px; padding: 8px 12px; }
            .card-title { font-size: 14px; }
            .card-price { font-size: 18px; }
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .debug-info {
            background: rgba(255,0,0,0.1);
            border: 1px solid rgba(255,0,0,0.3);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 12px;
            color: #ff6b6b;
            display: none;
            max-height: 150px;
            overflow-y: auto;
        }
        .debug-info.show {
            display: block;
        }
        .debug-info pre {
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0;
            font-size: 11px;
        }
        .tg-button {
            background: var(--success);
            color: var(--bg-color);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="debug-info" id="debugInfo">
        <strong>🐛 Отладка:</strong>
        <pre id="debugLog">Ожидание...</pre>
    </div>

    <div class="header">
        <div class="header-title">🎯 Маркет</div>
        <div class="header-balance" onclick="forceSync()">
            ⭐ <span id="balance">0</span>
            <span style="font-size:10px;color:var(--text-secondary);">🔄</span>
        </div>
    </div>

    <button class="sync-btn" id="syncBtn" onclick="forceSync()">
        🔄 Синхронизировать с ботом
    </button>

    <div class="tabs">
        <button class="tab-btn active" data-tab="market" onclick="switchTab('market')">🏪 Маркет</button>
        <button class="tab-btn" data-tab="auctions" onclick="switchTab('auctions')">🔨 Аукционы</button>
        <button class="tab-btn" data-tab="profile" onclick="switchTab('profile')">👤 Профиль</button>
        <button class="tab-btn" data-tab="sell" onclick="switchTab('sell')">📤 Продать</button>
    </div>

    <div id="content">
        <div id="tab-market" class="tab-content">
            <div id="market-list">
                <div class="empty-state">
                    <div class="empty-state-icon">⏳</div>
                    <div class="empty-state-title">Загрузка...</div>
                    <div>Ожидание данных от бота</div>
                </div>
            </div>
        </div>
        <div id="tab-auctions" class="tab-content" style="display:none;">
            <div id="auction-list">
                <div class="empty-state">
                    <div class="empty-state-icon">⏳</div>
                    <div class="empty-state-title">Загрузка...</div>
                    <div>Ожидание данных от бота</div>
                </div>
            </div>
        </div>
        <div id="tab-profile" class="tab-content" style="display:none;">
            <div id="profile-content">
                <div class="empty-state">
                    <div class="empty-state-icon">⏳</div>
                    <div class="empty-state-title">Загрузка...</div>
                    <div>Ожидание данных от бота</div>
                </div>
            </div>
        </div>
        <div id="tab-sell" class="tab-content" style="display:none;">
            <div id="sell-content">
                <div class="empty-state">
                    <div class="empty-state-icon">⏳</div>
                    <div class="empty-state-title">Загрузка...</div>
                    <div>Ожидание данных от бота</div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-title" id="modal-title">Заголовок</div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        // ============================================================
        // ОТЛАДОЧНЫЙ РЕЖИМ
        // ============================================================
        const DEBUG = true;
        const debugLog = document.getElementById('debugLog');
        const debugInfo = document.getElementById('debugInfo');
        
        function logDebug(msg) {
            if (!DEBUG) return;
            console.log('🐛', msg);
            if (debugLog) {
                const lines = debugLog.textContent.split('\n');
                if (lines.length > 20) lines.shift();
                lines.push(new Date().toLocaleTimeString() + ': ' + msg);
                debugLog.textContent = lines.join('\n');
                debugInfo.classList.add('show');
            }
        }

        // ============================================================
        // ИНИЦИАЛИЗАЦИЯ TELEGRAM
        // ============================================================
        
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        logDebug('Telegram WebApp инициализирован');

        // ============================================================
        // СОСТОЯНИЕ
        // ============================================================
        let state = {
            user: null,
            balance: 0,
            channels: [],
            auctions: [],
            userChannels: [],
            loading: false,
            dataReceived: false,
            pendingActions: []
        };

        let syncAttempts = 0;
        let syncTimeout = null;

        // ============================================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================================

        document.addEventListener('DOMContentLoaded', () => {
            logDebug('DOM загружен');
            
            const user = tg.initDataUnsafe?.user;
            logDebug('Пользователь из Telegram: ' + JSON.stringify(user));
            
            if (!user) {
                logDebug('❌ Пользователь НЕ НАЙДЕН! Открывайте через бота!');
                showToast('⚠️ Авторизуйтесь в боте', 'error');
                document.getElementById('balance').textContent = '❌';
                return;
            }
            
            state.user = user;
            logDebug('✅ Пользователь найден: ID=' + user.id + ', username=' + user.username);
            
            // Настраиваем кнопку внизу
            tg.MainButton.text = '🔄 Обновить';
            tg.MainButton.onClick(() => forceSync());
            tg.MainButton.show();
            logDebug('Кнопка "Обновить" настроена');
            
            // Первая загрузка через 500ms
            setTimeout(() => {
                logDebug('Первая синхронизация...');
                forceSync();
            }, 500);
        });

        // ============================================================
        // ОСНОВНАЯ ФУНКЦИЯ СИНХРОНИЗАЦИИ
        // ============================================================

        function forceSync() {
            logDebug('▶️ forceSync() вызвана');
            
            if (state.loading) {
                logDebug('⏳ Уже синхронизация...');
                showToast('⏳ Уже синхронизация...');
                return;
            }
            
            if (!state.user) {
                logDebug('❌ Нет пользователя!');
                showToast('❌ Нет данных пользователя', 'error');
                return;
            }
            
            state.loading = true;
            syncAttempts++;
            logDebug('🔄 Попытка синхронизации #' + syncAttempts);
            
            const syncBtn = document.getElementById('syncBtn');
            syncBtn.innerHTML = '<span class="loading-spinner"></span> Синхронизация...';
            syncBtn.classList.add('loading');
            
            showToast(`🔄 Синхронизация (попытка ${syncAttempts})...`);
            
            // Очищаем старые данные
            document.getElementById('balance').textContent = '⏳';
            
            // Отправляем запрос боту
            const payload = {
                action: 'get_data',
                user_id: state.user.id,
                timestamp: Date.now()
            };
            
            logDebug('📤 Отправка запроса: ' + JSON.stringify(payload));
            
            try {
                tg.sendData(JSON.stringify(payload));
                logDebug('✅ Запрос отправлен через tg.sendData()');
            } catch (e) {
                logDebug('❌ Ошибка отправки: ' + e.message);
                showToast('❌ Ошибка отправки запроса', 'error');
                state.loading = false;
                syncBtn.innerHTML = '🔄 Синхронизировать с ботом';
                syncBtn.classList.remove('loading');
                return;
            }
            
            // Таймаут на случай, если бот не ответит
            if (syncTimeout) clearTimeout(syncTimeout);
            syncTimeout = setTimeout(() => {
                if (state.loading) {
                    logDebug('⏰ Таймаут 10 секунд! Бот не отвечает.');
                    state.loading = false;
                    const btn = document.getElementById('syncBtn');
                    btn.innerHTML = '🔄 Синхронизировать с ботом';
                    btn.classList.remove('loading');
                    
                    if (!state.dataReceived) {
                        showToast('⚠️ Бот не отвечает. Проверьте, запущен ли бот.', 'error');
                        document.getElementById('balance').textContent = '⚠️';
                        logDebug('❌ Бот не ответил в течение 10 секунд');
                    }
                }
            }, 10000);
        }

        // ============================================================
        // ОБРАБОТКА ОТВЕТОВ ОТ БОТА
        // ============================================================

        tg.onEvent('message', (message) => {
            logDebug('📨 Получено сообщение от бота');
            
            // Если сообщение пришло как объект с текстом
            let text = typeof message === 'string' ? message : message?.text || '';
            if (!text) {
                logDebug('⚠️ Пустое сообщение');
                return;
            }
            
            logDebug('📨 Текст: ' + text.substring(0, 200) + (text.length > 200 ? '...' : ''));
            
            // Пробуем распарсить JSON
            try {
                const data = JSON.parse(text);
                logDebug('📦 Распарсено: ' + JSON.stringify(data).substring(0, 200));
                handleResponse(data);
            } catch (e) {
                logDebug('ℹ️ Не JSON сообщение: ' + e.message);
                // Если не JSON, может быть обычное сообщение от бота
                if (text.includes('Ошибка') || text.includes('error')) {
                    showToast('⚠️ ' + text, 'error');
                } else if (text.length < 100) {
                    showToast('ℹ️ ' + text);
                }
            }
        });

        // Обработка через событие data (альтернативный способ)
        tg.onEvent('data', (data) => {
            logDebug('📥 Получено событие "data"');
            if (typeof data === 'string') {
                try {
                    const parsed = JSON.parse(data);
                    handleResponse(parsed);
                } catch (e) {
                    logDebug('ℹ️ data не JSON: ' + data.substring(0, 100));
                }
            }
        });

        // ============================================================
        // ОБРАБОТКА ОТВЕТОВ
        // ============================================================

        function handleResponse(data) {
            logDebug('🔄 Обработка ответа: action=' + (data.action || 'unknown'));
            
            // Сбрасываем таймаут
            if (syncTimeout) {
                clearTimeout(syncTimeout);
                syncTimeout = null;
            }
            
            state.loading = false;
            const syncBtn = document.getElementById('syncBtn');
            syncBtn.innerHTML = '🔄 Синхронизировать с ботом';
            syncBtn.classList.remove('loading');
            
            // Проверяем статус
            if (data.status === 'error') {
                logDebug('❌ Ошибка от бота: ' + data.message);
                showToast('❌ ' + (data.message || 'Ошибка'), 'error');
                return;
            }
            
            // Обработка разных типов ответов
            switch (data.action) {
                case 'update_data':
                    handleUpdateData(data);
                    break;
                    
                case 'action_result':
                    handleActionResult(data);
                    break;
                    
                case 'balance_updated':
                    handleBalanceUpdate(data);
                    break;
                    
                default:
                    // Если есть data в ответе
                    if (data.data) {
                        handleUpdateData({ ...data, action: 'update_data' });
                    } else {
                        logDebug('ℹ️ Неизвестный ответ: ' + JSON.stringify(data));
                        if (data.message) {
                            showToast('ℹ️ ' + data.message);
                        }
                    }
            }
        }

        // ============================================================
        // ОБРАБОТКА ОБНОВЛЕНИЯ ДАННЫХ
        // ============================================================

        function handleUpdateData(data) {
            logDebug('📊 Обновление данных');
            
            const d = data.data || data;
            
            state.balance = d.balance || 0;
            state.channels = d.channels || [];
            state.auctions = d.auctions || [];
            state.userChannels = d.user_channels || [];
            
            if (d.user) {
                state.user = { ...state.user, ...d.user };
            }
            
            state.dataReceived = true;
            
            logDebug('✅ Данные обновлены: balance=' + state.balance + 
                    ', channels=' + state.channels.length + 
                    ', auctions=' + state.auctions.length +
                    ', userChannels=' + state.userChannels.length);
            
            // Обновляем баланс в шапке
            document.getElementById('balance').textContent = state.balance;
            
            // Обновляем все вкладки
            updateUI();
            
            // Показываем уведомление
            if (data.message) {
                showToast('✅ ' + data.message);
            } else {
                showToast(`✅ Данные загружены! Баланс: ${state.balance} ⭐`);
            }
            
            // Скрываем кнопку загрузки
            tg.MainButton.hideProgress();
        }

        function handleActionResult(data) {
            logDebug('⚡ Результат действия: ' + (data.success ? 'успех' : 'ошибка'));
            
            if (data.success) {
                showToast('✅ ' + (data.message || 'Действие выполнено'));
                // Через секунду обновляем данные
                setTimeout(forceSync, 1500);
            } else {
                showToast('❌ ' + (data.message || 'Ошибка выполнения'), 'error');
            }
        }

        function handleBalanceUpdate(data) {
            logDebug('💰 Обновление баланса');
            if (data.balance !== undefined) {
                state.balance = data.balance;
                document.getElementById('balance').textContent = state.balance;
                showToast('💰 Баланс обновлен: ' + state.balance + ' ⭐');
            }
            if (data.message) {
                showToast('✅ ' + data.message);
            }
        }

        // ============================================================
        // ОТПРАВКА ЗАПРОСОВ В БОТ
        // ============================================================

        function sendToBot(action, data = {}) {
            logDebug('📤 sendToBot(' + action + ')');
            
            if (!state.user) {
                logDebug('❌ Нет пользователя!');
                showToast('❌ Нет данных пользователя', 'error');
                return;
            }
            
            const payload = {
                action: action,
                user_id: state.user.id,
                ...data,
                timestamp: Date.now()
            };
            
            logDebug('📤 Пейлоад: ' + JSON.stringify(payload));
            
            try {
                tg.sendData(JSON.stringify(payload));
                logDebug('✅ Отправлено');
                showToast(`⏳ Выполняется ${action}...`);
            } catch (e) {
                logDebug('❌ Ошибка отправки: ' + e.message);
                showToast('❌ Ошибка отправки', 'error');
            }
        }

        // ============================================================
        // ОБНОВЛЕНИЕ UI
        // ============================================================

        function updateUI() {
            const activeTab = document.querySelector('.tab-btn.active');
            if (activeTab) switchTab(activeTab.dataset.tab);
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.tab === tabName) btn.classList.add('active');
            });
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            const target = document.getElementById(`tab-${tabName}`);
            if (target) target.style.display = 'block';
            
            switch(tabName) {
                case 'market': renderMarket(); break;
                case 'auctions': renderAuctions(); break;
                case 'profile': renderProfile(); break;
                case 'sell': renderSell(); break;
            }
        }

        // ============================================================
        // РЕНДЕРИНГ ВКЛАДОК
        // ============================================================

        function renderMarket() {
            const container = document.getElementById('market-list');
            const channels = state.channels.filter(c => !c.is_auction);
            
            if (!state.dataReceived) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⏳</div>
                        <div class="empty-state-title">Ожидание данных...</div>
                        <div>Нажмите "Синхронизировать"</div>
                    </div>
                `;
                return;
            }
            
            if (channels.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🛒</div>
                        <div class="empty-state-title">Нет товаров</div>
                        <div>На данный момент нет username на продаже</div>
                    </div>
                `;
                return;
            }
            
            let html = '';
            channels.forEach(ch => {
                html += `<div class="card" onclick="viewChannel(${ch.id}, 'fixed')">
                    <div class="card-title">${escapeHtml(ch.title || 'Unknown')}</div>
                    <div class="card-subtitle">@${escapeHtml(ch.username || '')}</div>
                    <div class="card-price">⭐ ${ch.price || 0}</div>
                    <div class="card-footer">
                        <span class="card-username">Продавец: ${ch.seller_id || '—'}</span>
                        <span class="card-badge badge-fixed">Фикс</span>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function renderAuctions() {
            const container = document.getElementById('auction-list');
            const auctions = state.auctions.filter(c => c.is_auction);
            
            if (!state.dataReceived) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⏳</div>
                        <div class="empty-state-title">Ожидание данных...</div>
                        <div>Нажмите "Синхронизировать"</div>
                    </div>
                `;
                return;
            }
            
            if (auctions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔨</div>
                        <div class="empty-state-title">Нет аукционов</div>
                        <div>Активные аукционы отсутствуют</div>
                    </div>
                `;
                return;
            }
            
            let html = '';
            auctions.forEach(ch => {
                const currentBid = ch.auction_current_bid || ch.price || 0;
                const timeLeft = ch.auction_end_time ? getTimeLeft(ch.auction_end_time) : 'Не начат';
                html += `<div class="card" onclick="viewChannel(${ch.id}, 'auction')">
                    <div class="card-title">${escapeHtml(ch.title || 'Unknown')}</div>
                    <div class="card-subtitle">@${escapeHtml(ch.username || '')}</div>
                    <div class="card-price">⭐ ${currentBid}</div>
                    <div class="card-footer">
                        <span class="card-username">⏰ ${timeLeft}</span>
                        <span class="card-badge badge-auction">Аукцион</span>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function renderProfile() {
            const container = document.getElementById('profile-content');
            
            if (!state.dataReceived) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⏳</div>
                        <div class="empty-state-title">Ожидание данных...</div>
                        <div>Нажмите "Синхронизировать"</div>
                    </div>
                `;
                return;
            }
            
            const user = state.user || { id: 'Неизвестно', username: 'Гость' };
            
            container.innerHTML = `
                <div class="card">
                    <div class="card-title">👤 Мой профиль</div>
                    <div class="card-subtitle">ID: ${user.id || '—'}</div>
                    <div class="card-subtitle">Username: ${user.username ? '@' + user.username : 'Не указан'}</div>
                </div>
                <div class="grid-2">
                    <div class="profile-stat">
                        <div class="profile-stat-number">${state.balance}</div>
                        <div class="profile-stat-label">⭐ Баланс</div>
                    </div>
                    <div class="profile-stat">
                        <div class="profile-stat-number">${state.userChannels.length}</div>
                        <div class="profile-stat-label">📤 Мои лоты</div>
                    </div>
                    <div class="profile-stat">
                        <div class="profile-stat-number">${user.total_bought || 0}</div>
                        <div class="profile-stat-label">🛒 Куплено</div>
                    </div>
                    <div class="profile-stat">
                        <div class="profile-stat-number">${user.total_sold || 0}</div>
                        <div class="profile-stat-label">💰 Продано</div>
                    </div>
                </div>
                <div style="margin-top:16px;">
                    <button class="btn btn-primary" onclick="showWithdrawModal()">💳 Вывод Stars</button>
                </div>
                <div style="margin-top:8px;">
                    <button class="btn btn-success" onclick="showTopupModal()">💎 Пополнить баланс</button>
                </div>
            `;
        }

        function renderSell() {
            const container = document.getElementById('sell-content');
            
            if (!state.dataReceived) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⏳</div>
                        <div class="empty-state-title">Ожидание данных...</div>
                        <div>Нажмите "Синхронизировать"</div>
                    </div>
                `;
                return;
            }
            
            const myLots = state.userChannels.filter(c => c.seller_id === state.user?.id);
            
            container.innerHTML = `
                <div class="card">
                    <div class="card-title">📤 Продать username</div>
                    <div class="card-subtitle">Выберите способ продажи</div>
                </div>
                <button class="btn btn-primary" style="margin-bottom:8px;" onclick="showSellModal('fixed')">
                    📢 Фиксированная цена
                </button>
                <button class="btn btn-success" onclick="showSellModal('auction')">
                    🔨 Аукцион
                </button>
                <div style="margin-top:20px;">
                    <div class="card">
                        <div class="card-title">📋 Мои лоты</div>
                        <div id="my-lots">
                            ${myLots.length === 0 ? 
                                '<div class="empty-state" style="padding:20px;"><div class="empty-state-title">Нет активных лотов</div></div>' :
                                myLots.map(c => `
                                    <div class="list-item">
                                        <div class="list-item-icon">${c.is_auction ? '🔨' : '📢'}</div>
                                        <div class="list-item-content">
                                            <div class="list-item-title">${escapeHtml(c.title || 'Unknown')}</div>
                                            <div class="list-item-subtitle">@${escapeHtml(c.username || '')}</div>
                                        </div>
                                        <div class="list-item-right">
                                            <div class="list-item-price">⭐ ${c.price || 0}</div>
                                            <button class="btn btn-danger btn-sm" onclick="removeLot(${c.id})">✕</button>
                                        </div>
                                    </div>
                                `).join('')
                            }
                        </div>
                    </div>
                </div>
            `;
        }

        // ============================================================
        // ДЕЙСТВИЯ
        // ============================================================

        function viewChannel(id, type) {
            const channel = type === 'fixed' 
                ? state.channels.find(c => c.id === id)
                : state.auctions.find(c => c.id === id);
                
            if (!channel) {
                showToast('❌ Канал не найден', 'error');
                return;
            }
            
            const isAuction = type === 'auction';
            const price = isAuction ? (channel.auction_current_bid || channel.price || 0) : (channel.price || 0);
            const title = isAuction ? '🔨 Аукцион' : '📢 Покупка';
            
            let bodyHTML = `
                <div style="margin-bottom:12px;"><strong>${escapeHtml(channel.title || 'Unknown')}</strong></div>
                <div style="color:var(--text-secondary);margin-bottom:8px;">@${escapeHtml(channel.username || '')}</div>
                <div style="font-size:24px;font-weight:700;color:var(--success);margin-bottom:16px;">⭐ ${price}</div>
            `;
            
            if (isAuction && channel.auction_end_time) {
                const timeLeft = getTimeLeft(channel.auction_end_time);
                const bidder = channel.auction_bidder_id ? 'ID ' + channel.auction_bidder_id : 'Нет ставок';
                bodyHTML += `
                    <div style="color:var(--text-secondary);font-size:13px;">⏰ Осталось: ${timeLeft}</div>
                    <div style="color:var(--text-secondary);font-size:13px;margin-top:4px;">
                        👤 Лидирует: ${bidder}
                    </div>
                `;
            }
            
            let footerHTML = `
                <button class="btn ${isAuction ? 'btn-success' : 'btn-primary'}" 
                    onclick="closeModal(); ${isAuction ? `placeBid(${id})` : `confirmBuy(${id})`}">
                    ${isAuction ? '💰 Сделать ставку' : '🛒 Купить'}
                </button>
                <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
            `;
            
            openModal(title, bodyHTML, footerHTML);
        }

        function confirmBuy(id) {
            closeModal();
            const channel = state.channels.find(c => c.id === id);
            if (!channel) {
                showToast('❌ Канал не найден', 'error');
                return;
            }
            
            if (state.balance < channel.price) {
                showToast(`❌ Недостаточно средств. Нужно: ${channel.price} ⭐`, 'error');
                return;
            }
            
            if (!confirm(`Купить "${channel.title}" за ${channel.price} ⭐?`)) return;
            
            sendToBot('buy', { channel_id: id });
        }

        function placeBid(id) {
            closeModal();
            const auction = state.auctions.find(c => c.id === id);
            if (!auction) {
                showToast('❌ Аукцион не найден', 'error');
                return;
            }
            
            const currentBid = auction.auction_current_bid || auction.price || 0;
            const minBid = currentBid + 1;
            
            openModal('💰 Сделать ставку', `
                <div style="margin-bottom:12px;"><strong>${escapeHtml(auction.title || 'Unknown')}</strong></div>
                <div style="color:var(--text-secondary);margin-bottom:16px;">
                    Текущая ставка: ⭐ ${currentBid}
                </div>
                <div class="form-group">
                    <label class="form-label">Ваша ставка (мин. ${minBid})</label>
                    <input class="form-input" type="number" id="bid-amount" 
                        value="${minBid}" min="${minBid}" step="1">
                </div>
                <div style="color:var(--text-secondary);font-size:13px;">
                    Ваш баланс: ⭐ ${state.balance}
                </div>
            `, `
                <button class="btn btn-success" onclick="submitBid(${id})">✅ Подтвердить</button>
                <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
            `);
        }

        function submitBid(id) {
            const input = document.getElementById('bid-amount');
            if (!input) return;
            
            const amount = parseInt(input.value);
            if (isNaN(amount) || amount <= 0) {
                showToast('❌ Введите корректную сумму', 'error');
                return;
            }
            
            if (amount > state.balance) {
                showToast(`❌ Недостаточно средств. Баланс: ${state.balance} ⭐`, 'error');
                return;
            }
            
            closeModal();
            sendToBot('bid', { channel_id: id, amount: amount });
        }

        function showWithdrawModal() {
            openModal('💳 Вывод Stars', `
                <div class="form-group">
                    <label class="form-label">Сумма вывода (мин. 50 ⭐)</label>
                    <input class="form-input" type="number" id="withdraw-amount" 
                        placeholder="Введите сумму" min="50" step="1">
                </div>
                <div style="color:var(--text-secondary);font-size:13px;">
                    Доступно: ⭐ ${state.balance}
                </div>
                <div style="color:var(--text-secondary);font-size:12px;margin-top:8px;">
                    ⚠️ Вывод обрабатывается администратором вручную
                </div>
            `, `
                <button class="btn btn-success" onclick="submitWithdraw()">✅ Вывести</button>
                <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
            `);
        }

        function submitWithdraw() {
            const input = document.getElementById('withdraw-amount');
            if (!input) return;
            
            const amount = parseInt(input.value);
            if (isNaN(amount) || amount < 50) {
                showToast('❌ Минимальная сумма: 50 ⭐', 'error');
                return;
            }
            if (amount > state.balance) {
                showToast(`❌ Недостаточно средств. Баланс: ${state.balance} ⭐`, 'error');
                return;
            }
            
            closeModal();
            if (!confirm(`Вывести ${amount} ⭐?`)) return;
            
            sendToBot('withdraw', { amount: amount });
        }

        function showTopupModal() {
            openModal('💎 Пополнение баланса', `
                <div class="grid-2" style="margin-bottom:12px;">
                    <button class="btn btn-success btn-sm" onclick="quickTopup(10)">10 ⭐</button>
                    <button class="btn btn-success btn-sm" onclick="quickTopup(50)">50 ⭐</button>
                    <button class="btn btn-success btn-sm" onclick="quickTopup(100)">100 ⭐</button>
                    <button class="btn btn-success btn-sm" onclick="quickTopup(250)">250 ⭐</button>
                </div>
                <div class="form-group">
                    <label class="form-label">Своя сумма</label>
                    <input class="form-input" type="number" id="topup-amount" 
                        placeholder="Введите сумму" min="1" step="1">
                </div>
                <div style="color:var(--text-secondary);font-size:13px;">
                    💳 Оплата через Telegram Stars
                </div>
            `, `
                <button class="btn btn-primary" onclick="submitTopup()">💎 Пополнить</button>
                <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
            `);
        }

        function quickTopup(amount) {
            closeModal();
            sendToBot('topup', { amount: amount });
        }

        function submitTopup() {
            const input = document.getElementById('topup-amount');
            if (!input) return;
            
            const amount = parseInt(input.value);
            if (isNaN(amount) || amount <= 0) {
                showToast('❌ Введите корректную сумму', 'error');
                return;
            }
            
            closeModal();
            sendToBot('topup', { amount: amount });
        }

        function showSellModal(type) {
            const title = type === 'fixed' ? '📢 Фиксированная цена' : '🔨 Аукцион';
            const priceLabel = type === 'fixed' ? 'Цена (⭐)' : 'Стартовая цена (⭐)';
            
            openModal(title, `
                <div class="form-group">
                    <label class="form-label">Ссылка на канал</label>
                    <input class="form-input" id="sell-channel" placeholder="https://t.me/username">
                </div>
                <div class="form-group">
                    <label class="form-label">${priceLabel}</label>
                    <input class="form-input" id="sell-price" type="number" 
                        placeholder="Минимум 5 ⭐" min="5" step="1">
                </div>
                <div style="color:var(--text-secondary);font-size:13px;">
                    ⚠️ Бот должен быть администратором канала
                </div>
            `, `
                <button class="btn btn-success" onclick="submitSell('${type}')">✅ Выставить</button>
                <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
            `);
        }

        function submitSell(type) {
            const channelInput = document.getElementById('sell-channel');
            const priceInput = document.getElementById('sell-price');
            
            if (!channelInput || !priceInput) return;
            
            const channel = channelInput.value.trim();
            const price = parseInt(priceInput.value);
            
            if (!channel) {
                showToast('❌ Введите ссылку на канал', 'error');
                return;
            }
            if (isNaN(price) || price < 5) {
                showToast('❌ Минимальная цена: 5 ⭐', 'error');
                return;
            }
            
            closeModal();
            sendToBot('sell', { 
                channel: channel, 
                price: price, 
                type: type 
            });
        }

        function removeLot(id) {
            if (!confirm('Снять лот с продажи?')) return;
            sendToBot('remove_lot', { channel_id: id });
        }

        // ============================================================
        // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================================

        function openModal(title, bodyHTML, footerHTML = '') {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = bodyHTML;
            document.getElementById('modal-footer').innerHTML = footerHTML;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        function getTimeLeft(timestamp) {
            const diff = timestamp * 1000 - Date.now();
            if (diff <= 0) return 'Завершен';
            const days = Math.floor(diff / 86400000);
            const hours = Math.floor((diff % 86400000) / 3600000);
            const minutes = Math.floor((diff % 3600000) / 60000);
            if (days > 0) return `${days}д ${hours}ч`;
            if (hours > 0) return `${hours}ч ${minutes}м`;
            return `${minutes}м`;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'error' ? 'error' : ''}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(20px)';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // ============================================================
        // ЗАВЕРШЕНИЕ ИНИЦИАЛИЗАЦИИ
        // ============================================================

        logDebug('✅ Приложение загружено!');
        logDebug('👤 Пользователь: ' + JSON.stringify(state.user));
        logDebug('🔄 Нажмите кнопку "Синхронизировать" для загрузки данных');
        console.log('✅ Username Market App загружен!');
        console.log('👤 Пользователь:', state.user);
        console.log('🔄 Нажмите кнопку "Синхронизировать" для загрузки данных');
    </script>
</body>
</html>
